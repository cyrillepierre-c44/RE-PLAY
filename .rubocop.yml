AllCops:
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'script/**/*'
    - 'support/**/*'
    - 'tmp/**/*'
    - 'test/**/*'
    # Redéfinir Exclude écrase la liste par défaut de RuboCop : vendor/ doit
    # être re-listé, sinon la CI (gems dans vendor/bundle) linte tout Rails.
    - 'vendor/**/*'
    - '.git/**/*'

Style/ConditionalAssignment:
  Enabled: false
Style/StringLiterals:
  Enabled: false
Style/RedundantReturn:
  Enabled: false
Style/Documentation:
  Enabled: false
Style/WordArray:
  Enabled: false
Metrics/AbcSize:
  Enabled: false
Style/MutableConstant:
  Enabled: false
Style/SignalException:
  Enabled: false
Metrics/CyclomaticComplexity:
  Enabled: false
Style/MissingRespondToMissing:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Style/FrozenStringLiteralComment:
  Enabled: false
Layout/LineLength:
  # 140 : les messages utilisateur en français interpolés dépassent
  # naturellement 120 sans que les couper aide à la lisibilité.
  Max: 140
Style/EmptyMethod:
  Enabled: false
Bundler/OrderedGems:
  Enabled: false
# Cohérent avec AbcSize/CyclomaticComplexity déjà désactivés : les métriques
# de taille ne sont pas un critère bloquant sur ce projet.
Metrics/MethodLength:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Metrics/BlockLength:
  Enabled: false
Metrics/PerceivedComplexity:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
